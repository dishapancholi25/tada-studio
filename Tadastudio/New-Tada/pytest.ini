[pytest]
pythonpath = .
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
# Ignore files that contain test-like names but aren't actual test files
testpaths = backend/tests
norecursedirs = .git .venv venv node_modules
# Use addopts to exclude specific files from collection
addopts = --ignore=backend/test_mcp_endpoint.py --ignore=backend/test_agent_import.py -m "not slow"
