worker_processes  1;

events { worker_connections 1024; }

http {
  sendfile on;
  client_max_body_size 2m;

  upstream nexus_be {
    server nexusagent-be.azurewebsites.net:443;
  }

  server {
    listen 9553;

    # Only the OAuth callback path needs to proxy
    location /oauth/callback {
      proxy_pass https://nexus_be/oauth/callback;
      proxy_set_header Host nexusagent-be.azurewebsites.net;  # preserve upstream host/SNI
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_ssl_server_name on;  # SNI for App Service
      proxy_redirect off;
    }

    # Sanity check
    location = /healthz { return 200; }
    location / { return 404; }
  }
}
