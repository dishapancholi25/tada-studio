name: Backstage TechDocs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
        inputs:
         environment:
          description: 'Environment to deploy'
          required: true
          default: 'prod'
         working_directory:
          description: 'Directory containing techdocs'
          required: true
          type: string
permissions:
  contents: read
  packages: read

jobs:
  techdocs:
    uses: synechron/.github/.github/workflows/backstage-publish-docs.yaml@backstage_pulish_doc
    with:
     working_directory: '.'
     environment: ${{ inputs.environment || 'prod' }}
    secrets: inherit
