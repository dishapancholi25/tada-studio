# Defense-in-depth for the "Authentication and Authorization Bypass via
# Spoofable Identity Headers" fix (PDF Finding 1.3).
#
# Restricts which pods can reach backend-svc:8000 directly. Only oauth2-proxy
# (which sets the trusted X-Auth-Request-* headers after validating the user)
# and frontend-svc (whose Next.js rewrites proxy /api/* to the backend) are
# allowed in. This also protects WebSocket auth paths (/api/collab,
# /api/notifications/ws), which do not use the AUTH_PROXY_SHARED_SECRET check.
#
# Apply per namespace, e.g.:
#   kubectl apply -f networkpolicy-backend.yaml -n tadastudio-uat
#   kubectl apply -f networkpolicy-backend.yaml -n tadastudio-dev
#
# Adjust podSelector labels below if your oauth2-proxy/frontend pods use
# different labels than shown in `kubectl get pods --show-labels`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-app-restrict-ingress
spec:
  podSelector:
    matchLabels:
      app: backend-app
  policyTypes:
    - Ingress
  ingress:
    # Allow oauth2-proxy (validates identity, injects trusted headers)
    - from:
        - podSelector:
            matchLabels:
              app: oauth-proxy
      ports:
        - protocol: TCP
          port: 8000
    # Allow frontend (Next.js rewrites /api/* to backend-svc internally)
    - from:
        - podSelector:
            matchLabels:
              app: frontend-app
      ports:
        - protocol: TCP
          port: 8000
    # Allow same-namespace ingress controller / health checks if applicable.
    # Add additional `from:` blocks here for monitoring/Phoenix/etc. if they
    # call the backend directly.
