[tool.uv]
constraint-dependencies = [
    "torch>=2.0.0",
    # cryptography must satisfy joserfc (>=45.0.1, auth/JWT), presidio-anonymizer
    # (>=46.0.4) and msal (<49, Azure AD). Floor 48.0.1 avoids the OpenSSL vuln
    # GHSA-537c-gmf6-5ccf that is present in 48.0.0.
    "cryptography>=48.0.1,<49",
]
# llm-guard 0.3.16 hard-pins presidio-*==2.2.358, which caps cryptography <44.1 and
# breaks joserfc's cryptography>=45 requirement. presidio 2.2.362 is API-compatible
# and needs cryptography>=46.0.4, satisfying auth. override-dependencies forces our
# version over llm-guard's exact pin (a constraint alone cannot override an '==').
override-dependencies = [
    "presidio-analyzer==2.2.362",
    "presidio-anonymizer==2.2.362",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
test = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
]
