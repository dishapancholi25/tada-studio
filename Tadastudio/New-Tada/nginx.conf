# /etc/nginx/nginx.conf
events { worker_connections 1024; }

http {
    gzip on; gzip_vary on; gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # ***** sidecars are on the same host -> use localhost *****
    upstream frontend { server 127.0.0.1:3000; }
    upstream backend  { server 127.0.0.1:8000; }
    upstream oauth2   { server 127.0.0.1:4180; }

    # Capture access token from oauth2-proxy auth subrequest
    # oauth2-proxy may return this in different headers depending on config
    map $upstream_http_x_auth_request_access_token $authz_header {
        default "";
        "~.+"   "Bearer $upstream_http_x_auth_request_access_token";
    }

    # Fallback: try X-Forwarded-Access-Token if X-Auth-Request-Access-Token is empty
    map $upstream_http_x_forwarded_access_token $authz_header_fallback {
        default "";
        "~.+"   "Bearer $upstream_http_x_forwarded_access_token";
    }

    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    server {
        listen 80;
        server_name _;   # or your default domain

        client_max_body_size 100M;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # ISG Finding 1.9: Strip oauth2-proxy internal auth headers from
        # all proxied responses so tokens never reach the browser.
        proxy_hide_header X-Auth-Request-Access-Token;
        proxy_hide_header X-Auth-Request-Email;
        proxy_hide_header X-Auth-Request-User;
        proxy_hide_header X-Auth-Request-Username;
        proxy_hide_header X-Auth-Request-Preferred-Username;
        proxy_hide_header X-Auth-Request-Groups;
        proxy_hide_header X-Forwarded-Access-Token;

        # --- auth subrequest to oauth2-proxy ---
        location = /oauth2/auth {
            internal;
            proxy_pass         http://oauth2/oauth2/auth;
            proxy_set_header   X-Original-URI $request_uri;
            proxy_set_header   X-Real-IP      $remote_addr;
            proxy_set_header   X-Scheme       $scheme;
            proxy_set_header   Host           $host;

            # Pass original cookies to oauth2-proxy
            proxy_set_header   Cookie         $http_cookie;

            # Ensure oauth2-proxy has context to return the token
            proxy_pass_header  Authorization;
        }

        # public oauth2 endpoints
        location /oauth2/ {
            proxy_pass http://oauth2;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffer_size 128k;
            proxy_buffers 8 256k;
            proxy_busy_buffers_size 256k;
        }

        location @oauth2_signin {
            return 302 https://$host/login?rd=$request_uri;
        }

        # -------- Public: Next.js static assets (no auth required) --------
        # JS/CSS bundles must be accessible for the login page to function
        location /_next/ {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -------- Public HTTP Execution Endpoints (No OAuth2Proxy Auth) --------
        # These endpoints handle their own authentication via Personal Access Tokens (PATs)
        # Must be defined BEFORE the general /api/ block for proper matching precedence

        location ~ ^/api/http-execution/trigger/ {
            # No auth_request - authentication handled by FastAPI backend via PAT tokens

            # Rate limiting for public endpoints (more restrictive than authenticated)
            limit_req zone=api burst=10 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Extended timeouts for workflow execution
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        location ~ ^/api/http-execution/trigger-form/ {
            # No auth_request - handles file uploads with form data

            limit_req zone=api burst=10 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        location ~ ^/api/http-execution/trigger-sse/ {
            # No auth_request - Server-Sent Events streaming endpoint

            limit_req zone=api burst=10 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE-specific settings
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            chunked_transfer_encoding on;

            # Disable buffering for SSE streaming
            proxy_buffering off;
            proxy_cache off;

            # Long timeouts for SSE connections
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        location ~ ^/api/http-execution/info/ {
            # No auth_request - public endpoint for workflow execution info

            limit_req zone=api burst=20 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # -------- Internal: unified session check (local JWT + oauth2-proxy) --------
        location = /api/auth/nginx-check {
            internal;
            proxy_pass         http://backend;
            proxy_set_header   Cookie         $http_cookie;
            proxy_set_header   X-Original-URI $request_uri;
            proxy_set_header   X-Real-IP      $remote_addr;
            proxy_set_header   X-Scheme       $scheme;
            proxy_set_header   Host           $host;
        }

        # -------- Public: custom login page (no auth required) --------
        location = /login {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffer_size 128k;
            proxy_buffers 8 256k;
            proxy_busy_buffers_size 256k;
        }

        # -------- Public: local auth login/logout/status (no auth required) --------
        # Only the session endpoints are public. Admin user-management routes
        # (/api/auth/local/users/*) fall through to the authenticated /api/ block.
        location ~ ^/api/auth/local/(status|login|logout)$ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -------- /api/auth/me: returns 401 on failure (no redirect) --------
        # The frontend's AuthContext calls this from every page (including /login)
        # to check auth status.  If we use error_page 401 = @oauth2_signin here,
        # the fetch silently follows the 302, gets HTML instead of JSON, and the
        # auth check never resolves -- causing a redirect/loading loop.
        # Omitting error_page lets nginx return a clean 401 that the frontend
        # handles gracefully.
        location = /api/auth/me {
            auth_request /api/auth/nginx-check;
            # Deliberately NO error_page 401 = @oauth2_signin

            auth_request_set $user         $upstream_http_x_auth_request_user;
            auth_request_set $email        $upstream_http_x_auth_request_email;
            auth_request_set $access_token $upstream_http_x_auth_request_access_token;

            proxy_set_header X-Auth-Request-User  $user;
            proxy_set_header X-Auth-Request-Email $email;
            proxy_set_header Authorization        $authz_header;
            proxy_set_header X-Auth-Request-Access-Token $access_token;

            limit_req zone=api burst=20 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -------- API (HTTP) - Authenticated Endpoints --------
        location /api/ {
            auth_request /api/auth/nginx-check;
            error_page 401 = @oauth2_signin;

            # Capture all auth headers from oauth2-proxy
            auth_request_set $user         $upstream_http_x_auth_request_user;
            auth_request_set $email        $upstream_http_x_auth_request_email;
            auth_request_set $access_token $upstream_http_x_auth_request_access_token;

            # Forward user context to backend
            proxy_set_header X-Auth-Request-User  $user;
            proxy_set_header X-Auth-Request-Email $email;

            # Pass the access token in BOTH formats for compatibility
            # 1. Standard Authorization header (preferred by backend)
            proxy_set_header Authorization        $authz_header;
            # 2. X-Auth-Request-Access-Token header (direct access for debugging)
            proxy_set_header X-Auth-Request-Access-Token $access_token;

            limit_req zone=api burst=20 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # -------- API WebSockets --------
        location /api/ws/ {
            auth_request /api/auth/nginx-check;
            error_page 401 = @oauth2_signin;

            # Capture auth headers from oauth2-proxy
            auth_request_set $user         $upstream_http_x_auth_request_user;
            auth_request_set $access_token $upstream_http_x_auth_request_access_token;

            # Forward to backend
            proxy_set_header X-Auth-Request-User  $user;
            proxy_set_header Authorization        $authz_header;
            proxy_set_header X-Auth-Request-Access-Token $access_token;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 7d; proxy_send_timeout 7d; proxy_read_timeout 7d;
        }

        # legacy WS
        location /api/graph/ws/ {
            auth_request /api/auth/nginx-check;
            error_page 401 = @oauth2_signin;

            # Capture auth headers from oauth2-proxy
            auth_request_set $user         $upstream_http_x_auth_request_user;
            auth_request_set $access_token $upstream_http_x_auth_request_access_token;

            # Forward to backend
            proxy_set_header X-Auth-Request-User  $user;
            proxy_set_header Authorization        $authz_header;
            proxy_set_header X-Auth-Request-Access-Token $access_token;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 7d; proxy_send_timeout 7d; proxy_read_timeout 7d;
        }

        # -------- Frontend --------
        location / {
            auth_request /api/auth/nginx-check;
            error_page 401 = @oauth2_signin;

            auth_request_set $user  $upstream_http_x_auth_request_user;
            proxy_set_header X-Auth-Request-User  $user;
            proxy_set_header Authorization        $authz_header;

            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffer_size 128k;
            proxy_buffers 8 256k;
            proxy_busy_buffers_size 256k;

            proxy_connect_timeout 30s; proxy_send_timeout 30s; proxy_read_timeout 30s;
        }

        # health
        location /nginx-health {
            access_log off;
            # Re-add security headers (nginx bug: add_header in location overwrites server block)
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Content-Type text/plain;
            return 200 "healthy\n";
        }

        error_page 502 503 504 /50x.html;
        location = /50x.html { root /usr/share/nginx/html; }
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
