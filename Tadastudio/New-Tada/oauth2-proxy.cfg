# OAuth2 Proxy Configuration for Azure AD Integration
# =======================================================
# This configuration enables oauth2-proxy to:
# 1. Authenticate users via Microsoft Azure AD (Entra ID)
# 2. Forward access tokens to the backend via nginx
# 3. Maintain user sessions with cookies

# Provider Configuration
# -----------------------
provider = "oidc"
provider_display_name = "Microsoft Azure AD"

# IMPORTANT: These must be set via environment variables or command-line flags
# - OAUTH2_PROXY_CLIENT_ID (Azure App Registration Client ID)
# - OAUTH2_PROXY_CLIENT_SECRET (Azure App Registration Client Secret)
# - OAUTH2_PROXY_OIDC_ISSUER_URL (e.g., https://login.microsoftonline.com/{tenant-id}/v2.0)
# - OAUTH2_PROXY_REDIRECT_URL (e.g., https://yourdomain.com/oauth2/callback)

# Token and Header Configuration
# --------------------------------
# CRITICAL: These flags ensure the access token is forwarded to nginx/backend
set_xauthrequest = true              # Enable X-Auth-Request-* headers (identity only)
pass_access_token = false            # ISG 1.9: Do NOT pass access token in X-Auth-Request-Access-Token
pass_authorization_header = true     # Pass token via standard Authorization header instead
pass_user_headers = true             # Pass user info headers (email, username, etc.)

# Cookie Configuration
# ---------------------
cookie_name = "_oauth2_proxy"
cookie_secret = ""                   # MUST be set via OAUTH2_PROXY_COOKIE_SECRET (32-byte random string)
cookie_secure = true                 # Require HTTPS in production
cookie_httponly = true               # Prevent JS access to cookies
cookie_samesite = "lax"              # CSRF protection
cookie_expire = "168h"               # 7 days
cookie_refresh = "1h"                # Refresh token every hour

# Session Configuration
# ----------------------
session_store_type = "cookie"        # Store session in cookie (simple deployment)
# For production with multiple instances, consider:
# session_store_type = "redis"
# redis_connection_url = "redis://redis:6379"

# Upstream and Listening
# -----------------------
http_address = "0.0.0.0:4180"        # Listen on all interfaces, port 4180
upstreams = [
    "http://127.0.0.1:8000"          # Not used in auth_request mode, but required
]

# Email and Domain Validation
# -----------------------------
email_domains = ["*"]                # Allow all email domains (restrict in production!)
# For production, specify allowed domains:
# email_domains = ["yourcompany.com"]

# Skip authentication for specific paths
# ----------------------------------------
skip_auth_routes = [
    "^/nginx-health$",               # Health check endpoint
    "^/login$",                       # Custom dual-path login page
    "^/api/auth/local/",              # Local email/password auth endpoints
    "^/api/auth/nginx-check$",        # nginx unified session check (internal only)
]

# Logging
# --------
# Set via environment variable: OAUTH2_PROXY_LOG_LEVEL=debug
# Options: debug, info, warn, error

# Azure AD Specific Settings
# ----------------------------
# These are typically set via environment variables:
# - OAUTH2_PROXY_SCOPE: "openid profile email"
# - OAUTH2_PROXY_OIDC_ISSUER_URL: "https://login.microsoftonline.com/{tenant-id}/v2.0"

# Security Headers
# -----------------
# oauth2-proxy automatically sets security headers
# These can be customized via command-line flags if needed

# Reverse Proxy Settings
# ------------------------
reverse_proxy = true                 # We're behind nginx
real_client_ip_header = "X-Real-IP"  # Trust X-Real-IP from nginx

# Request Logging
# ----------------
request_logging = true
auth_logging = true
standard_logging = true

# TLS/SSL Settings
# -----------------
# In Azure App Service, TLS is handled by the platform
# No need to configure TLS in oauth2-proxy itself

# Timeouts
# ---------
flush_interval = "1s"
